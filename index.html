<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Контент Завод — Дашборд</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js"></script>

  <script>

    // Chart.js defaults for readable text on dark background
    if (window.Chart) {
      // Global text color + font weight
      Chart.defaults.color = '#ffffff';
      Chart.defaults.font = Chart.defaults.font || {};
      Chart.defaults.font.weight = '700';

      // Legend labels
      Chart.defaults.plugins.legend.labels.color = '#ffffff';
      Chart.defaults.plugins.legend.labels.font = Chart.defaults.plugins.legend.labels.font || {};
      Chart.defaults.plugins.legend.labels.font.weight = '700';

      // Tooltip text
      Chart.defaults.plugins.tooltip.titleColor = '#ffffff';
      Chart.defaults.plugins.tooltip.bodyColor = '#ffffff';
    }
  </script>

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #999999;
      --accent: #ccff00;
      --accent-dark: #99cc00;
      --cyan: #00ffff;
      --pink: #ff00ff;
      --green: #00ff00;
      --border: #333333;
      --card-bg: #0a0a0a;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 50px;
      height: 50px;
      background: var(--accent);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      color: var(--bg);
      font-size: 24px;
    }

    .header-text h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 4px;
      background: var(--card-bg);
      border: 1px solid var(--border);
    }

    .field input {
      width: 250px;
      outline: none;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 12px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .btn.primary {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
    }

    .btn.primary:hover {
      background: var(--accent-dark);
    }

    .btn.update {
      background: #1e66ff;
      color: #ffffff;
      border-color: #1e66ff;
    }
    .btn.update:hover {
      background: #1556d6;
      border-color: #1556d6;
      color: #ffffff;
    }

    .status {
      padding: 10px 16px;
      border-radius: 4px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
    }

    .status.success {
      color: var(--green);
      border-color: var(--green);
    }

    .status.error {
      color: #ff4444;
      border-color: #ff4444;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    @media (max-width: 1200px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .kpi-grid { grid-template-columns: 1fr; }
    }

    .kpi-card {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card-bg);
      padding: 20px;
      text-align: center;
    }

    .kpi-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 40px;
      font-weight: 900;
      color: var(--accent);
    }

    .kpi-card.instagram .kpi-value { color: var(--pink); }
    .kpi-card.tiktok .kpi-value { color: var(--cyan); }
    .kpi-card.youtube .kpi-value { color: var(--green); }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    @media (max-width: 1200px) {
      .charts-grid { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
    }

    .chart-card {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card-bg);
      padding: 20px;
    }

    .chart-card h3 {
      margin: 0 0 16px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--accent);
    }

    .chart-container {
      position: relative;
      height: 300px;
    }

    .table-card {
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--card-bg);
      padding: 20px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    table th {
      padding: 12px;
      text-align: left;
      font-weight: 900;
      text-transform: uppercase;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
    }

    table td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    table tr:hover {
      background: rgba(204, 255, 0, 0.03);
    }

    .tag {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 3px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 9px;
    }

    .tag.instagram {
      background: rgba(255, 0, 255, 0.15);
      color: var(--pink);
    }

    .tag.tiktok {
      background: rgba(0, 255, 255, 0.15);
      color: var(--cyan);
    }

    .tag.youtube {
      background: rgba(0, 255, 0, 0.15);
      color: var(--green);
    }

    .debug {
      margin-top: 20px;
      padding: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: #ff4444;
      font-size: 11px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 200px;
      overflow-y: auto;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div style="display: flex; align-items: center; gap: 16px;">
        <div class="logo">◆</div>
        <div class="header-text">
          <h1>Контент Завод <span class="subtitle">— Статистика обновляется раз в сутки в 10:00 МСК</span></h1>
        </div>
      </div>
      <div class="controls">
        <div class="field">
          <input id="apiKey" type="password" placeholder="API ключ..." />
        </div>
        <button class="btn primary" id="btnLoad">Загрузить</button>
        <div class="status" id="status">Готово</div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-label">Всего просмотров</div>
        <div class="kpi-value" id="totalViews">0</div>
      </div>
      <div class="kpi-card instagram">
        <div class="kpi-label">Instagram</div>
        <div class="kpi-value" id="instaViews">0</div>
      </div>
      <div class="kpi-card tiktok">
        <div class="kpi-label">TikTok</div>
        <div class="kpi-value" id="tiktokViews">0</div>
      </div>
      <div class="kpi-card youtube">
        <div class="kpi-label">YouTube</div>
        <div class="kpi-value" id="youtubeViews">0</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Распределение просмотров</h3>
        <div class="chart-container">
          <canvas id="viewsChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Количество контента</h3>
        <div class="chart-container">
          <canvas id="contentChart"></canvas>
        </div>
      </div>
      <div class="chart-card">
        <h3>Средний охват</h3>
        <div class="chart-container">
          <canvas id="avgChart"></canvas>
        </div>
      </div>
    </div>

    <div class="table-card">
      <table>
        <thead>
          <tr>
            <th>Платформа</th>
            <th>Аккаунт</th>
            <th>Просмотры</th>
            <th>Контент</th>
            <th>Средний охват</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr>
            <td colspan="5" style="text-align: center; color: var(--muted);">Загрузите данные</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div id="debug" class="debug" style="display: none;"></div>
  </div>

  <script>
    const webhookUrl = "https://nikolaenko-ds.ru/webhook/content-zavod-stats";
    let allData = null;
    let charts = {};

    const elKey = document.getElementById("apiKey");
    const elBtnLoad = document.getElementById("btnLoad");
    const elStatus = document.getElementById("status");
    const elDebug = document.getElementById("debug");

    function setStatus(text, type = "info") {
      elStatus.textContent = text;
      elStatus.className = "status " + type;
      console.log(`[${type.toUpperCase()}] ${text}`);
    }

    function showDebug(text) {
      elDebug.style.display = "block";
      elDebug.textContent = text;
    }

    async function loadData() {
      const key = elKey.value.trim();
      if (!key) {
        setStatus("Введите API-ключ", "error");
        return;
      }

      setStatus("Загрузка...", "info");
      elBtnLoad.disabled = true;
      elDebug.style.display = "none";

      try {
        const url = `${webhookUrl}?key=${encodeURIComponent(key)}`;
        console.log("Запрос к:", url);

        const response = await fetch(url, {
          method: "GET",
          headers: {
            "Accept": "application/json"
          }
        });

        console.log("Статус ответа:", response.status);

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const text = await response.text();
        console.log("Текст ответа:", text.substring(0, 500));

        if (!text) {
          throw new Error("Пустой ответ от сервера");
        }

        allData = JSON.parse(text);
        console.log("Данные загружены:", allData);

        updateUI();
        renderCharts();
        setStatus("Данные загружены", "success");
        // После первой успешной загрузки превращаем кнопку в "Обновить"
        elBtnLoad.textContent = "Обновить";
        elBtnLoad.classList.remove("primary");
        elBtnLoad.classList.add("update");
      } catch (error) {
        console.error("Ошибка:", error);
        setStatus("Ошибка загрузки", "error");
        showDebug(`ОШИБКА: ${error.message}\n\nПроверьте:\n1. Webhook URL правильный\n2. n8n workflow активен\n3. API-ключ корректный\n\nОткройте консоль браузера (F12) для подробностей`);
      } finally {
        elBtnLoad.disabled = false;
      }
    }

    function updateUI() {
      console.log("updateUI called with data:", allData);
      
      // Проверяем структуру данных
      if (!allData || !allData.summary) {
        console.error("Неверная структура данных", allData);
        return;
      }

      const summary = allData.summary;
      console.log("Summary:", summary);
      
      document.getElementById("totalViews").textContent = (summary.total_views || 0).toLocaleString();

      const platformStats = summary.platform_stats || [];
      console.log("Platform stats:", platformStats);
      
      const insta = platformStats.find(p => p.platform === "instagram");
      const tiktok = platformStats.find(p => p.platform === "tiktok");
      const youtube = platformStats.find(p => p.platform === "youtube");
      
      console.log("Instagram:", insta, "TikTok:", tiktok, "YouTube:", youtube);

      document.getElementById("instaViews").textContent = (insta && insta.total_views ? insta.total_views.toLocaleString() : "0");
      document.getElementById("tiktokViews").textContent = (tiktok && tiktok.total_views ? tiktok.total_views.toLocaleString() : "0");
      document.getElementById("youtubeViews").textContent = (youtube && youtube.total_views ? youtube.total_views.toLocaleString() : "0");

      const tbody = document.getElementById("tableBody");
      if (!allData.daily_stats || allData.daily_stats.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--muted);">Нет данных</td></tr>';
        return;
      }
      
      tbody.innerHTML = allData.daily_stats.map(stat => {
        const account = allData.accounts.find(a => a.account_id === stat.account_id && a.platform === stat.platform);
        const avg = stat.content_count > 0 ? Math.round(stat.total_views / stat.content_count) : 0;
        return `
          <tr>
            <td><span class="tag ${stat.platform}">${stat.platform.toUpperCase()}</span></td>
            <td><strong>${account?.display_name || stat.account_id}</strong></td>
            <td>${stat.total_views.toLocaleString()}</td>
            <td>${stat.content_count}</td>
            <td>${avg.toLocaleString()}</td>
          </tr>
        `;
      }).join("");
    }

    function renderCharts() {
      if (!allData || !allData.summary || !allData.summary.platform_stats) {
        console.error("Неверная структура данных для графиков");
        return;
      }
      
      const summary = allData.summary;
      const platformStats = summary.platform_stats || [];

      const platforms = platformStats.map(p => {
        const name = p.platform || "unknown";
        return name.charAt(0).toUpperCase() + name.slice(1);
      });
      const views = platformStats.map(p => p.total_views || 0);
      const content = platformStats.map(p => p.content_count || 0);
      const avgViews = platformStats.map(p => {
        const cnt = p.content_count || 0;
        return cnt > 0 ? Math.round((p.total_views || 0) / cnt) : 0;
      });
      
      console.log("Platforms:", platforms, "Views:", views, "Content:", content, "Avg:", avgViews);

      const colors = {
        instagram: 'rgb(255, 0, 255)',
        tiktok: 'rgb(0, 255, 255)',
        youtube: 'rgb(0, 255, 0)'
      };

      const platformColors = platformStats.map(p => colors[p.platform]);

      Object.values(charts).forEach(chart => {
        if (chart && typeof chart.destroy === 'function') {
          chart.destroy();
        }
      });
      charts = {};

      // Views Chart
      try {
      charts.views = new Chart(document.getElementById('viewsChart'), {
        type: 'pie',
        data: {
          labels: platforms,
          datasets: [{
            data: views,
            backgroundColor: platformColors,
            borderColor: 'var(--bg)',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#ffffff',
                font: { weight: '700', size: 13 }
              }
            }, padding: 16 }
            }
          }
        }
      });
      } catch(e) { console.error("Ошибка рисования графика просмотров:", e); }

      // Content Chart
      try {
      charts.content = new Chart(document.getElementById('contentChart'), {
        type: 'doughnut',
        data: {
          labels: platforms,
          datasets: [{
            data: content,
            backgroundColor: platformColors,
            borderColor: 'var(--bg)',
            borderWidth: 2
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#ffffff',
                font: { weight: '700', size: 13 }
              }
            }, padding: 16 }
            }
          }
        }
      });
      } catch(e) { console.error("Ошибка рисования графика контента:", e); }

      // Average Chart
      try {
      charts.avg = new Chart(document.getElementById('avgChart'), {
        type: 'bar',
        data: {
          labels: platforms,
          datasets: [{
            label: 'Средний охват',
            data: avgViews,
            backgroundColor: platformColors,
            borderColor: platformColors,
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: {
              position: 'bottom',
              labels: {
                color: '#ffffff',
                font: { weight: '700', size: 13 }
              }
            } },
          scales: {
            x: {
              ticks: { color: '#ffffff', font: { size: 12, weight: '700' } },
              grid: { color: 'rgba(255,255,255,0.15)' }
            },
            y: {
              beginAtZero: true,
              ticks: { color: '#ffffff', font: { size: 12, weight: '700' } },
              grid: { color: 'rgba(255,255,255,0.15)' }
            }
          } },
              grid: { color: 'rgba(51, 51, 51, 0.3)' }
            },
            x: {
              ticks: { color: '#ffffff', font: { size: 10, weight: '700' } },
              grid: { display: false }
            }
          }
        }
      });
      } catch(e) { console.error("Ошибка рисования графика среднего охвата:", e); }
    }

    elBtnLoad.addEventListener('click', loadData);
</script>
</body>
</html>
